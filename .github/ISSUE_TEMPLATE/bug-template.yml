name: Bug Report
description: Technical issue
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior

  - type: textarea
    id: screenshots
    attributes:
      label: Logs / Screenshots